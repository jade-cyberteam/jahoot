<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · jahoot</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <span class="brand">jahoot</span>
    <span class="eyebrow" id="title">Loading…</span>
    <span class="eyebrow mono" id="progress"></span>
  </div>

  <!-- lobby -->
  <section class="center" id="lobby" hidden>
    <p class="eyebrow">Join at <strong id="joinHost" class="mono"></strong></p>
    <div class="passcode" id="passcode" aria-label="Game passcode"></div>
    <p class="tally"><strong id="playerCount">0</strong> in the room</p>
    <div class="roster" id="roster"></div>
    <div class="row">
      <button class="btn" id="start" disabled>Start</button>
    </div>
    <p class="note" id="lobbyHint">Waiting for the first player.</p>
  </section>

  <!-- question / reveal -->
  <section class="stack" id="play" hidden style="flex:1">
    <h1 class="question" id="questionText"></h1>
    <div class="clock" id="clock">
      <div class="clock-track"></div>
      <div class="clock-digits mono">0</div>
    </div>
    <p class="tally"><strong id="answered">0</strong> of <strong id="expected">0</strong> answered</p>
    <div class="tiles" id="tiles"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="skip" data-variant="quiet">Skip</button>
      <button class="btn" id="next" hidden>Next</button>
    </div>
  </section>

  <!-- between-question scoreboard -->
  <section class="center" id="scoreboard" hidden>
    <p class="eyebrow">Standings</p>
    <div class="panel" style="width:min(100%,44rem)">
      <table class="board">
        <thead><tr><th class="rank">#</th><th>Player</th><th class="score">Score</th></tr></thead>
        <tbody id="boardBody"></tbody>
      </table>
    </div>
    <button class="btn" id="next2">Next question</button>
  </section>

  <!-- podium -->
  <section class="center" id="final" hidden>
    <p class="eyebrow">Final</p>
    <div class="podium" id="podium"></div>
    <div class="panel" style="width:min(100%,44rem)">
      <table class="board">
        <thead><tr><th class="rank">#</th><th>Player</th><th class="score">Score</th></tr></thead>
        <tbody id="finalBody"></tbody>
      </table>
    </div>
    <p class="note">Scoreboard kept for 30 days at <a id="resultLink" class="mono" href="#"></a></p>
  </section>

  <p class="alert" id="error" role="alert" hidden></p>
</main>

<script type="module">
import { $, GLYPHS, api, connect, createClock, renderPasscode, show, text } from "/app/common.js";

const quizId = location.pathname.split("/")[2] || "";
const clock = createClock($("#clock"));
let socket = null;
let lastIndex = -1;

const sections = {
  lobby: $("#lobby"),
  play: $("#play"),
  scoreboard: $("#scoreboard"),
  final: $("#final"),
};

function showOnly(name) {
  for (const [key, el] of Object.entries(sections)) show(el, key === name);
}

function fail(message) {
  $("#error").textContent = message;
  show($("#error"), true);
}

/**
 * A game's host credentials are kept per quiz in sessionStorage, so reloading
 * the projector tab rejoins the same game instead of starting a second one.
 */
const storeKey = `jahoot:host:${quizId}`;

async function boot() {
  let saved = null;
  try {
    saved = JSON.parse(sessionStorage.getItem(storeKey) || "null");
  } catch { /* corrupt entry; start a fresh game */ }

  if (saved?.code) {
    // Confirm the game is still alive before trusting the stored passcode.
    try {
      await api(`/api/games/${saved.code}`);
    } catch {
      saved = null;
    }
  }

  if (!saved) {
    try {
      saved = await api("/api/games", {
        method: "POST",
        body: JSON.stringify({ quizId }),
      });
      sessionStorage.setItem(storeKey, JSON.stringify(saved));
    } catch (e) {
      fail(e.message);
      return;
    }
  }

  text($("#title"), saved.title);
  text($("#joinHost"), `${location.host}`);
  renderPasscode($("#passcode"), saved.code);
  $("#resultLink").href = `/results/${saved.gameId}`;
  $("#resultLink").textContent = `${location.host}/results/${saved.gameId}`;

  socket = connect(`/ws/host/${saved.code}?hostToken=${encodeURIComponent(saved.hostToken)}`, {
    onState: render,
    onMessage: (msg) => { if (msg.type === "error") fail(msg.message); },
  });

  $("#start").addEventListener("click", () => socket.send({ action: "start" }));
  $("#skip").addEventListener("click", () => socket.send({ action: "skip" }));
  $("#next").addEventListener("click", () => socket.send({ action: "next" }));
  $("#next2").addEventListener("click", () => socket.send({ action: "next" }));
}

function render(state) {
  if (state.phase === "gone") return fail("This game has ended.");
  show($("#error"), false);
  text($("#title"), state.title);

  if (state.phase === "lobby") {
    showOnly("lobby");
    text($("#playerCount"), state.players.length);
    $("#start").disabled = state.players.length === 0;
    text(
      $("#lobbyHint"),
      state.players.length === 0
        ? "Waiting for the first player."
        : `${state.questionCount} questions. Start when everyone is in.`,
    );
    renderRoster(state.players);
    text($("#progress"), "");
    return;
  }

  text($("#progress"), `Q${state.questionIndex + 1}/${state.questionCount}`);

  if (state.phase === "question" || state.phase === "reveal") {
    showOnly("play");
    renderQuestion(state);
    return;
  }

  if (state.phase === "scoreboard") {
    showOnly("scoreboard");
    clock.stop();
    renderBoard($("#boardBody"), state.leaderboard);
    const last = state.questionIndex + 1 >= state.questionCount;
    text($("#next2"), last ? "Show results" : "Next question");
    return;
  }

  if (state.phase === "final") {
    showOnly("final");
    clock.stop();
    renderPodium(state.leaderboard);
    renderBoard($("#finalBody"), state.leaderboard);
  }
}

function renderRoster(players) {
  const roster = $("#roster");
  const seen = new Set();
  for (const p of players) {
    seen.add(p.id);
    let badge = roster.querySelector(`[data-id="${p.id}"]`);
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "badge";
      badge.dataset.id = p.id;
      badge.textContent = p.name;
      roster.append(badge);
    }
    badge.dataset.offline = String(!p.connected);
  }
  for (const badge of [...roster.children]) {
    if (!seen.has(badge.dataset.id)) badge.remove();
  }
}

function renderQuestion(state) {
  const q = state.question;
  if (!q) return;
  const revealed = state.phase === "reveal";

  text($("#questionText"), q.text);
  text($("#answered"), state.answeredCount);
  text($("#expected"), state.players.length);

  if (revealed) {
    clock.freeze(0, q.timeLimit);
  } else if (state.questionIndex !== lastIndex) {
    clock.start(q.endsAt, q.timeLimit);
  }
  lastIndex = state.questionIndex;

  show($("#skip"), !revealed);
  show($("#next"), revealed);
  const last = state.questionIndex + 1 >= state.questionCount;
  text($("#next"), last ? "Show results" : "Standings");

  const tiles = $("#tiles");
  tiles.dataset.count = q.answers.length;
  tiles.innerHTML = "";
  q.answers.forEach((answer, i) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    if (revealed) tile.dataset.state = answer.correct ? "correct" : "dim";

    const glyph = document.createElement("span");
    glyph.className = "tile-glyph";
    glyph.textContent = GLYPHS[i] ?? "●";
    tile.append(glyph);

    const label = document.createElement("span");
    label.textContent = answer.text;
    tile.append(label);

    if (revealed && state.distribution) {
      const count = document.createElement("span");
      count.className = "tile-count mono";
      count.textContent = state.distribution[i] ?? 0;
      tile.append(count);
    }
    tiles.append(tile);
  });
}

function renderBoard(tbody, rows) {
  tbody.innerHTML = "";
  rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    const rank = document.createElement("td");
    rank.className = "rank mono";
    rank.textContent = i + 1;
    const name = document.createElement("td");
    name.textContent = row.name;
    const score = document.createElement("td");
    score.className = "score mono";
    score.textContent = row.score.toLocaleString();
    tr.append(rank, name, score);
    tbody.append(tr);
  });
}

function renderPodium(rows) {
  const podium = $("#podium");
  podium.innerHTML = "";
  rows.slice(0, 3).forEach((row, i) => {
    const plinth = document.createElement("div");
    plinth.className = "plinth";
    plinth.dataset.place = i + 1;
    plinth.innerHTML =
      `<span class="place mono">${i + 1}</span>` +
      `<span class="who"></span>` +
      `<span class="score mono">${row.score.toLocaleString()}</span>`;
    plinth.querySelector(".who").textContent = row.name;
    podium.append(plinth);
  });
}

boot();
</script>
</body>
</html>
