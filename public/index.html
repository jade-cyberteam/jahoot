<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jahoot</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <span class="brand">jahoot</span>
    <a class="eyebrow" href="/admin" style="text-decoration:none">Make a quiz &rarr;</a>
  </div>

  <div class="center">
    <p class="eyebrow">Game passcode</p>
    <form id="join" class="stack" style="width:min(100%,26rem)" novalidate>
      <input
        class="code-input mono"
        id="code"
        name="code"
        inputmode="numeric"
        autocomplete="off"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="000000"
        aria-label="Six digit game passcode"
        required>
      <button class="btn" type="submit">Enter</button>
      <p class="alert" id="error" role="alert" hidden></p>
    </form>
    <p class="note">The host is showing the passcode on screen.</p>
  </div>
</main>

<script type="module">
import { $, api, show } from "/app/common.js";

const form = $("#join");
const input = $("#code");
const error = $("#error");

// Deep link straight into a game: /?code=123456
const preset = new URLSearchParams(location.search).get("code");
if (preset) input.value = preset.replace(/\D/g, "").slice(0, 6);
input.focus();

input.addEventListener("input", () => {
  input.value = input.value.replace(/\D/g, "").slice(0, 6);
  show(error, false);
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const code = input.value;
  if (code.length !== 6) {
    error.textContent = "A passcode is six digits.";
    show(error, true);
    return;
  }
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    await api(`/api/games/${code}`);
    location.href = `/play?code=${code}`;
  } catch (e) {
    error.textContent = e.message;
    show(error, true);
    button.disabled = false;
  }
});
</script>
</body>
</html>
